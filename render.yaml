# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and point it at the repo. Render reads this file and
# creates all three resources below in one go.
#
# Plans are currently set to `free`, by deliberate choice — know the real
# limitations that come with it before relying on this for anything beyond
# a demo/smoke-test of the deploy pipeline:
#   - The web service spins down after 15 min with no inbound traffic, and
#     takes ~1 min to cold-start on the next request. This app's WebSocket
#     gateways (live ride-offer dispatch, live tracking) drop any open
#     connection when that happens, and BullMQ's scheduled/repeatable jobs
#     (report emails, etc.) simply don't fire while the service is asleep.
#   - Free Postgres auto-deletes 30 days after creation (14-day grace
#     period to upgrade before the data is gone for good).
#   - Free Key Value (Redis) has no data persistence — a restart loses
#     whatever was queued in BullMQ at that moment.
# Bump every `plan:` value below to a paid tier (see PROGRESS.md for the
# ones already tested — `0.5c-512mb` / `0.1c-256mb` / `256mb`) the moment
# any of that matters. Nothing else in this file needs to change to do that
# — except also re-adding `preDeployCommand` below, which Render rejects on
# free plans (paid-only feature) and is omitted here for that reason; the
# Dockerfile's own CMD already runs `prisma migrate deploy` before booting
# either way, so migrations still apply correctly without it.
#
# Region: everything below is pinned to the same region (oregon) since
# same-region services talk to each other over Render's private network —
# free, lower-latency, and (for the Redis connection specifically) doesn't
# require TLS. Change all three `region` values together if you'd rather
# deploy closer to Nigeria (e.g. `frankfurt`).

databases:
  - name: kilo-postgres
    plan: free
    region: oregon
    postgresMajorVersion: '16'

services:
  - name: kilo-redis
    type: keyvalue
    plan: free
    region: oregon
    ipAllowList: [] # empty = no external access; the web service reaches it over the private network

  - name: kilo-backend
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_SWAGGER
        value: 'false' # flip to "true" if you want /docs reachable in production
      - key: DATABASE_URL
        fromDatabase:
          name: kilo-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: kilo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kilo-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # Everything below is either a real secret or an environment-specific
      # URL — Render will prompt for each of these once, in the dashboard,
      # during Blueprint creation (nothing here is stored in this file).
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: BUSINESS_APP_URL
        sync: false
      - key: GUARANTOR_APP_URL
        sync: false
      - key: SUPERADMIN_PHONE
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SMILE_IDENTITY_PARTNER_ID
        sync: false
      - key: SMILE_IDENTITY_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
