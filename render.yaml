# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and point it at the repo. Render reads this file and
# creates all three resources below in one go.
#
# Plans below are Render's cheapest PAID tier for each resource — chosen
# deliberately over `free`, which spins the web service down after 15 min
# idle (breaks the WebSocket-based ride dispatch/tracking in this app) and
# auto-deletes the Postgres database 30 days after creation. Bump the plan
# values up as real traffic needs it; the field names won't change.
#
# Region: everything below is pinned to the same region (oregon) since
# same-region services talk to each other over Render's private network —
# free, lower-latency, and (for the Redis connection specifically) doesn't
# require TLS. Change all three `region` values together if you'd rather
# deploy closer to Nigeria (e.g. `frankfurt`).

databases:
  - name: kilo-postgres
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: '16'

services:
  - name: kilo-redis
    type: keyvalue
    plan: 256mb
    region: oregon
    ipAllowList: [] # empty = no external access; the web service reaches it over the private network

  - name: kilo-backend
    type: web
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Belt-and-suspenders with the Dockerfile's own CMD (which also runs
    # `prisma migrate deploy` before starting) — this just makes migrations
    # run before traffic cuts over, on plans where it's supported. Both are
    # safe to run back-to-back: migrate deploy is a no-op with nothing pending.
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_SWAGGER
        value: 'false' # flip to "true" if you want /docs reachable in production
      - key: DATABASE_URL
        fromDatabase:
          name: kilo-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: kilo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kilo-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # Everything below is either a real secret or an environment-specific
      # URL — Render will prompt for each of these once, in the dashboard,
      # during Blueprint creation (nothing here is stored in this file).
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: BUSINESS_APP_URL
        sync: false
      - key: GUARANTOR_APP_URL
        sync: false
      - key: SUPERADMIN_PHONE
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SMILE_IDENTITY_PARTNER_ID
        sync: false
      - key: SMILE_IDENTITY_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
